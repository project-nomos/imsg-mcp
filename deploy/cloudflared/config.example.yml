# Config for the tunnel created with `cloudflared tunnel create` (docs/cloudflare.md, step 1).
# Save it as ~/.cloudflared/imsg-mcp.yml with the id and credentials file that
# `cloudflared tunnel create mac-mini` printed. (A tunnel managed from the dashboard keeps
# these ingress rules in the dashboard instead and needs no file.)
#
# Both hostnames reach the same local server. Cloudflare Access sits in front of each:
#   imsg.example.com        people (Managed OAuth): Claude web, desktop, mobile, Claude Code
#   imsg-agent.example.com  machines (service tokens), optional: Agent SDK and other headless agents
tunnel: <tunnel-id>
credentials-file: /Users/<you>/.cloudflared/<tunnel-id>.json

ingress:
  - hostname: imsg.example.com
    service: http://127.0.0.1:8787
  - hostname: imsg-agent.example.com
    service: http://127.0.0.1:8787
  # Everything else, including the health port, is refused.
  - service: http_status:404
# 127.0.0.1 rather than "localhost": the server listens on IPv4 loopback only, and
# "localhost" can resolve to ::1 first.
