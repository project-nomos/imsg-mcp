name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Remove phone numbers, emails, names and message text** from anything you paste.
        Security problems: please use the repository's Security tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Remote (serve, behind Cloudflare)
        - Local (stdio)
        - selftest / check-config
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client
      placeholder: Claude web / desktop / mobile / Duet, Claude Code, Agent SDK, other
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `imsg-mcp version`, `imsg --version`, and `sw_vers -productVersion`.
      placeholder: imsg-mcp 0.1.0, imsg 0.8.2, macOS 26.1
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: imsg-mcp check-config output
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant server.log lines and /healthz output
      description: From ~/Library/Logs/imsg-mcp/server.log and `curl -s http://127.0.0.1:8788/healthz`.
      render: text
