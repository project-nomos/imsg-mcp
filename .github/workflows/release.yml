name: Release

# A release happens when a commit on main changes the version in package.json:
# run scripts/bump-version.sh X.Y.Z, commit, push. The workflow checks the code, builds
# the binaries and the MCP Bundle, publishes the GitHub release with the CHANGELOG notes,
# and lists it in the official MCP Registry. Run it by hand with "dry run" on to build and
# validate everything without publishing.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate only; publish nothing
        type: boolean
        default: true

permissions:
  contents: write # the tag and the GitHub release
  id-token: write # MCP Registry login through GitHub OIDC

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"
  MCP_PUBLISHER_VERSION: v1.8.7

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # tags

      - name: Decide what to do
        id: plan
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          version="$(jq -r .version package.json)"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then new=false; else new=true; fi
          build=false; publish=false
          if [ "$DRY_RUN" = "true" ]; then build=true
          elif [ "$new" = "true" ]; then build=true; publish=true
          else echo "::notice::${tag} is already released; nothing to do."
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "build=${build}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.plan.outputs.build == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: steps.plan.outputs.build == 'true'
        run: bun install --frozen-lockfile
      - if: steps.plan.outputs.build == 'true'
        run: bun run check

      - name: Release notes
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" > release-notes.md
          cat >> release-notes.md <<'EOF'

          ---

          **Files**

          - `imsg-mcp-*.mcpb`: local mode in Claude Desktop on Apple silicon. Open it to install, then grant Claude Full Disk Access. It starts read-only; see the README.
          - `imsg-mcp-v*-darwin-*.tar.gz`: the server binary for remote mode. macOS ties Full Disk Access and Automation grants to the code signature, so sign it with your own stable identity before installing, and use the same identity for every update ([docs/mac-mini-setup.md](https://github.com/project-nomos/imsg-mcp/blob/main/docs/mac-mini-setup.md)).
          - `SHA256SUMS`: checksums for all of the above.
          EOF

      - name: Build binaries
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          TARGET=bun-darwin-arm64 OUT=dist/arm64/imsg-mcp scripts/build.sh
          TARGET=bun-darwin-x64 OUT=dist/x64/imsg-mcp scripts/build.sh
          mkdir -p out
          tar -C dist/arm64 -czf "out/imsg-mcp-v${VERSION}-darwin-arm64.tar.gz" imsg-mcp
          tar -C dist/x64 -czf "out/imsg-mcp-v${VERSION}-darwin-x64.tar.gz" imsg-mcp

      - name: Build the MCP Bundle
        id: mcpb
        if: steps.plan.outputs.build == 'true'
        run: |
          result="$(scripts/build-mcpb.sh dist/arm64/imsg-mcp out)"
          echo "sha256=$(printf '%s\n' "$result" | sed -n 2p)" >> "$GITHUB_OUTPUT"
          (cd out && shasum -a 256 ./*.tar.gz ./*.mcpb > SHA256SUMS)

      - name: Write the MCP Registry entry
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SHA256: ${{ steps.mcpb.outputs.sha256 }}
        run: scripts/server-json.sh "$VERSION" "$SHA256" > server.json

      - name: Install cosign
        if: steps.plan.outputs.build == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate the MCP Registry entry
        if: steps.plan.outputs.build == 'true'
        run: ./mcp-publisher validate

      - name: Keep the files (dry run)
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            out/
            server.json
            release-notes.md
          retention-days: 7

      - name: Publish the GitHub release
        if: steps.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.plan.outputs.tag }}
          body_path: release-notes.md
          files: out/*
          fail_on_unmatched_files: true

      - name: Publish to the MCP Registry
        if: steps.plan.outputs.publish == 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
